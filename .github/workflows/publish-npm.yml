name: Publish npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable package version to publish (for example 0.1.3)
        required: true
        type: string
      expected_sha:
        description: Full 40-character main commit SHA reviewed for this release
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == '8DX-io/8dx-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha256: ${{ steps.pack.outputs.sha256 }}
      integrity: ${{ steps.pack.outputs.integrity }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Validate release request
        shell: bash
        run: |
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]]
          [[ "$RELEASE_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use tested npm CLI
        run: npm install --global npm@11.9.0 --ignore-scripts
      - name: Verify release metadata
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const read = name => JSON.parse(readFileSync(name, 'utf8'));
          const pkg = read('package.json');
          const lock = read('package-lock.json');
          const server = read('server.json');
          assert.equal(pkg.name, '@8dx/8dx-mcp-server');
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          assert.equal(pkg.mcpName, 'io.github.8DX-io/8dx-mcp-server');
          assert.equal(pkg.repository.url, 'git+https://github.com/8DX-io/8dx-mcp-server.git');
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.equal(server.name, pkg.mcpName);
          assert.equal(server.version, pkg.version);
          assert.equal(server.packages.length, 1);
          assert.equal(server.packages[0].registryType, 'npm');
          assert.equal(server.packages[0].identifier, pkg.name);
          assert.equal(server.packages[0].version, pkg.version);
          assert.deepEqual(server.packages[0].transport, { type: 'stdio' });
          assert.equal(server.remotes, undefined);
          JS
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack and inspect the exact publish artifact
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/npm-release" "$RUNNER_TEMP/npm-inspect"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-release"
          mv "$RUNNER_TEMP/npm-release/8dx-8dx-mcp-server-$RELEASE_VERSION.tgz" "$RUNNER_TEMP/npm-release/package.tgz"
          tar -xzf "$RUNNER_TEMP/npm-release/package.tgz" -C "$RUNNER_TEMP/npm-inspect"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { pathToFileURL } from 'node:url';
          const base = `${process.env.RUNNER_TEMP}/npm-inspect/package`;
          for (const file of ['package.json', 'server.json', 'dist/index.js', 'dist/version.js']) {
            assert.deepEqual(readFileSync(`${base}/${file}`), readFileSync(file));
          }
          const version = await import(pathToFileURL(`${base}/dist/version.js`));
          assert.equal(version.PACKAGE_VERSION, process.env.RELEASE_VERSION);
          assert.equal(version.SOURCE_HEADER_VALUE, `8dx-mcp/${process.env.RELEASE_VERSION}`);
          assert.ok(readFileSync(`${base}/dist/index.js`, 'utf8').startsWith('#!/usr/bin/env node\n'));
          const bytes = readFileSync(`${process.env.RUNNER_TEMP}/npm-release/package.tgz`);
          const sha256 = createHash('sha256').update(bytes).digest('hex');
          const integrity = `sha512-${createHash('sha512').update(bytes).digest('base64')}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `sha256=${sha256}\nintegrity=${integrity}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            `Package: @8dx/8dx-mcp-server@${process.env.RELEASE_VERSION}\n\nCommit: ${process.env.GITHUB_SHA}\n\nSHA256: ${sha256}\n`);
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release/package.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    if: github.repository == '8DX-io/8dx-mcp-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
      EXPECTED_INTEGRITY: ${{ needs.build.outputs.integrity }}
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Use tested npm CLI
        run: npm install --global npm@11.9.0 --ignore-scripts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-release
          path: ${{ runner.temp }}/npm-release
      - name: Verify artifact checksum
        shell: bash
        run: |
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/npm-release/package.tgz" | sha256sum --check --strict
      - name: Publish through npm trusted publishing
        run: >-
          npm publish "$RUNNER_TEMP/npm-release/package.tgz"
          --registry=https://registry.npmjs.org/
          --access public --tag latest --ignore-scripts
      - name: Verify published version and integrity
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const url = `https://registry.npmjs.org/@8dx%2f8dx-mcp-server/${process.env.RELEASE_VERSION}`;
          for (let attempt = 0; attempt < 6; attempt++) {
            const response = await fetch(url);
            if (response.status === 404 && attempt < 5) {
              await new Promise(resolve => setTimeout(resolve, 5000));
              continue;
            }
            assert.ok(response.ok, `Registry returned ${response.status}`);
            const pkg = await response.json();
            assert.equal(pkg.name, '@8dx/8dx-mcp-server');
            assert.equal(pkg.version, process.env.RELEASE_VERSION);
            assert.equal(pkg.mcpName, 'io.github.8DX-io/8dx-mcp-server');
            assert.equal(pkg.dist.integrity, process.env.EXPECTED_INTEGRITY);
            console.log(`Verified ${pkg.name}@${pkg.version} with matching tarball integrity`);
            break;
          }
          JS
