startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      eightdxApiBaseUrl:
        type: string
        description: 8DX REST API base URL.
        default: https://swap.ggp.gg
      eightdxRequestTimeoutMs:
        type: number
        description: Request timeout in milliseconds.
        default: 30000
  commandFunction: |
    (config) => ({
      command: "npx",
      args: ["-y", "@8dx/8dx-mcp-server"],
      env: {
        EIGHTDX_API_BASE_URL: config.eightdxApiBaseUrl || "https://swap.ggp.gg",
        EIGHTDX_REQUEST_TIMEOUT_MS: String(config.eightdxRequestTimeoutMs || 30000)
      }
    })
